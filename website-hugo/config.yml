# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: inalix/website-hugo
  branch: main
  base_url: https://sve-auth.styawan.workers.dev

i18n:
  structure: multiple_folders
  locales: [en, id]

media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 1024
        height: 1024
      svg:
        optimize: true

media_folder: /public/media
public_folder: /media

collections:
  - name: products
    label: Products
    label_singular: Product
    folder: /content/{{locale}}/products
    path: "{{slug}}/index"
    media_folder: images
    public_folder: images
    preview: false
    i18n: true
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Thumbnail, name: thumbnail, widget: image, i18n: duplicate }
      - { label: Body, name: body, widget: richtext, i18n: true }
      - { label: Image, name: image, widget: image, i18n: duplicate }
      - { label: Gallery, name: gallery, widget: image, multiple: true, i18n: duplicate }

  - name: news
    label: News
    label_singular: News
    folder: /content/{{locale}}/news
    path: "{{slug}}/index"
    media_folder: images
    public_folder: images
    i18n: true
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Draft, name: draft, widget: boolean, i18n: duplicate }
      - { label: Image, name: image, widget: image, multiple: true, i18n: duplicate }
      - { label: Meta Title, name: meta_title, widget: compute, value: '{{fields.title}} | INALIX', i18n: true }
      - { label: Description , name: description, widget: string, i18n: true }
      - { label: Author, name: author, widget: relation, collection: team, search_fields: ["name", "title"], value_field: "{{slug}}", display_fields: ["name", "title"], i18n: duplicate } 
      - { label: Solution, name: solution, widget: relation, collection: solution, search_fields: ["name"], value_field: "name", display_fields: ["name"], i18n: duplicate }
      - { label: Date, name: date, widget: datetime, type: date, i18n: duplicate }
      - { label: Body, name: body, widget: richtext, i18n: true }

  - name: pages
    label: Pages
    label_singular: Page
    folder: /content/{{locale}}/pages
    path: "{{slug}}/index"
    media_folder: images
    public_folder: images
    preview: false
    i18n: true
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Body, name: body, widget: richtext, i18n: true }

  - name: office
    label: Offices
    label_singular: Office
    identifier_field: name
    folder: /content/office
    path: "{{slug}}/index"
    media_folder: images
    public_folder: images
    i18n: false
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Address, name: address, widget: richtext }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Location, name: point, widget: map, required: false}
      - { label: Image, name: image, widget: image, multiple: true , required: false}
  
  - name: division
    label: Divisions
    label_singular: division
    identifier_field: name
    folder: /content/division
    preview: false
    i18n: false
    fields:
      - { label: Name Division, name: name, widget: string }

  - name: team
    label: Teams
    identifier_field: name
    label_singular: team
    folder: /content/team
    path: "{{slug}}/index"
    media_folder: images
    public_folder: images
    i18n: false
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Profile Picture, name: photo, widget: image }
      - { label: Job Title, name: title, widget: string }
      - { label: Division, name: division, widget: relation, collection: division, default: "project", search_fields: ["name"], value_field: "{{slug}}", display_fields: ["name"] }
      - { label: Office, name: office, widget: relation, collection: office, search_fields: ["name"], value_field: "{{slug}}", display_fields: ["name"] }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: richtext, required: false }

  - name: clients
    label: Clients 
    identifier_field: name
    label_singular: client
    folder: /content/clients
    path: "{{slug}}/index"
    media_folder: images
    public_folder: images
    preview: false
    i18n: false
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Address, name: address, widget: richtext }
      - { label: Image, name: image, widget: image, multiple: false , required: true}
      - { label: Draft, name: draft, widget: boolean, default: false }

  
  - name: solution
    label: Solutions
    label_singular: Solution
    identifier_field: name
    folder: /content/solution
    preview: false
    i18n: false
    fields:
      - { label: Solution Name, name: name, widget: string }
