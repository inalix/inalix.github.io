# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: inalix/website-hugo
  branch: main
  base_url: https://sve-auth.styawan.workers.dev

media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 1024
        height: 1024
      svg:
        optimize: true

media_folder: /public/media
public_folder: /media

collections:
  - name: products
    label: Products
    label_singular: Product
    folder: /content/products
    path: "{{slug}}/index"
    media_folder: images
    public_folder: images
    preview: false
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Thumbnail, name: thumbnail, widget: image }
      - { label: Body, name: body, widget: richtext }
      - { label: Gallery, name: gallery, widget: image, multiple: true }

  - name: news
    label: News
    label_singular: News
    folder: /content/english/news
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Draft, name: draft, widget: boolean }
      - { label: Image, name: image, widget: image, multiple: true }
      - { label: Meta Title, name: meta_title, widget: string }
      - { label: Description , name: description, widget: string }
      - { label: Author, name: author, widget: relation, collection: team, search_fields: ["name"], value_field: name, display_fields: ["name"] } 
      - { label: Solution, name: solution, widget: relation, collection: solution, search_fields: ["name"], value_field: name, display_fields: ["name"] }
      - { label: Date, name: date, widget: datetime, type: date }
      - { label: Body, name: body, widget: richtext }

  - name: office
    label: Offices
    label_singular: Office
    identifier_field: name
    folder: /content/office
    path: "{{slug}}/index"
    media_folder: media
    public_folder: media
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Address, name: address, widget: richtext }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Location, name: point, widget: map, required: false}
      - { label: Image, name: image, widget: image, multiple: true , required: false}
  
  - name: division
    label: Divisions
    label_singular: division
    identifier_field: name
    folder: /content/division
    fields:
      - { label: Name Division, name: name, widget: string }

  - name: team
    label: Teams
    identifier_field: name
    label_singular: team
    folder: /content/team
    path: "{{slug}}/index"
    media_folder: images
    public_folder: images
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Profile Picture, name: photo, widget: image }
      - { label: Job Title, name: title, widget: string }
      - { label: Division, name: division, widget: relation, collection: division, search_fields: ["name"], value_field: name, display_fields: ["name"] }
      - { label: Office, name: office, widget: relation, collection: office }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: richtext, required: false }

  - name: clients
    label: Clients 
    identifier_field: name
    label_singular: client
    folder: /content/clients
    path: "{{slug}}/index"
    media_folder: images
    public_folder: images
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Address, name: address, widget: richtext }
      - { label: Image, name: image, widget: image, multiple: false , required: true}
      - { label: Draft, name: draft, widget: boolean, default: false }

  - name: pages
    label: Pages
    label_singular: Page
    folder: /content/pages
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: richtext }
      
